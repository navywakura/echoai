[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echoai"
version = "5.8.3"
description = "Cognitive agent with persistent memory, WSP archives and local tools"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "RxLabs"}]
license = {file = "LICENSE"}
classifiers = ["Development Status :: 5 - Production/Stable", "Programming Language :: Python :: 3", "Environment :: Console"]

[project.optional-dependencies]
arc = ["numpy>=1.26,<3"]

[project.scripts]
echoai = "echoai.cli:main"
echo-dev = "echoai.cli:dev_main"

[project.urls]
Source = "https://github.com/navywakura/echoai"
Download = "https://huggingface.co/RxLabs/echoai-5.8"
